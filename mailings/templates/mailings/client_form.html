{% extends 'users/base.html' %}

{% block title %}{% if object %}Редактировать клиента{% else %}Добавить клиента{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать клиента{% else %}Добавить клиента{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
<a href="{% url 'client_list' %}" class="btn btn-secondary">Вернуться к списку</a>
{% endblock %}
